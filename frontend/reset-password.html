<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FitAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold gradient-text">FitAI</h1>
        </div>

        <!-- Forgot Password Form -->
        <div id="forgotForm" class="bg-white rounded-2xl shadow-lg p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Forgot Password</h2>
            <p class="text-gray-500 text-sm mb-6">Enter your email and we'll send a reset link.</p>

            <form id="forgotPasswordForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="forgotEmail" required placeholder="your@email.com"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>

                <div id="forgotSuccess" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm">
                    Reset link sent! Check your email.
                </div>
                <div id="forgotError" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm"></div>

                <button type="submit" id="forgotBtn"
                    class="w-full gradient-bg text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">
                    Send Reset Link
                </button>
            </form>

            <p class="text-center mt-4 text-sm text-gray-500">
                Remember your password?
                <a href="login.html" class="text-purple-600 font-medium hover:underline">Login</a>
            </p>
        </div>

        <!-- Reset Password Form (shown when token present in URL) -->
        <div id="resetForm" class="hidden bg-white rounded-2xl shadow-lg p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Set New Password</h2>
            <p class="text-gray-500 text-sm mb-6">Enter your new password below.</p>

            <form id="resetPasswordForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                    <input type="password" id="newPassword" required placeholder="At least 6 characters" minlength="6"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="Repeat password"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>

                <div id="resetSuccess" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm">
                    Password reset! Redirecting to login...
                </div>
                <div id="resetError" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm"></div>

                <button type="submit" id="resetBtn"
                    class="w-full gradient-bg text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">
                    Reset Password
                </button>
            </form>
        </div>
    </div>

    <script>
    const API_URL = 'http://localhost:5000/api';
    let resetToken = null;

    // Step 1: Check email
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('forgotBtn');
        btn.disabled = true;
        btn.textContent = 'Checking...';
        document.getElementById('forgotError').classList.add('hidden');
        document.getElementById('forgotSuccess').classList.add('hidden');

        try {
            const res  = await fetch(`${API_URL}/auth/forgot-password`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email: document.getElementById('forgotEmail').value })
            });
            const data = await res.json();
            if (data.success) {
                resetToken = data.data.token;
                // Hide forgot form, show reset form
                document.getElementById('forgotForm').classList.add('hidden');
                document.getElementById('resetForm').classList.remove('hidden');
            } else {
                document.getElementById('forgotError').textContent = data.message;
                document.getElementById('forgotError').classList.remove('hidden');
            }
        } catch(err) {
            document.getElementById('forgotError').textContent = 'Network error';
            document.getElementById('forgotError').classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Continue';
        }
    });

    // Step 2: Reset password
    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPw  = document.getElementById('newPassword').value;
        const confPw = document.getElementById('confirmPassword').value;

        if (newPw !== confPw) {
            document.getElementById('resetError').textContent = 'Passwords do not match';
            document.getElementById('resetError').classList.remove('hidden');
            return;
        }

        const btn = document.getElementById('resetBtn');
        btn.disabled = true;
        btn.textContent = 'Resetting...';
        document.getElementById('resetError').classList.add('hidden');

        try {
            const res  = await fetch(`${API_URL}/auth/reset-password`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ token: resetToken, new_password: newPw })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('resetSuccess').classList.remove('hidden');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                document.getElementById('resetError').textContent = data.message;
                document.getElementById('resetError').classList.remove('hidden');
            }
        } catch(err) {
            document.getElementById('resetError').textContent = 'Network error';
            document.getElementById('resetError').classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Reset Password';
        }
    });
</script>
</body>
</html>
