<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FitAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .step-active {
            background: #667eea;
            color: white;
        }
        
        .step-completed {
            background: #10b981;
            color: white;
        }
        
        .step-inactive {
            background: #e5e7eb;
            color: #9ca3af;
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="login.html" class="flex items-center">
                    <h1 class="text-2xl font-bold gradient-bg bg-clip-text text-transparent">🤖 FitAI</h1>
                </a>
                <div class="flex gap-4">
                    <a href="login.html" class="text-gray-700 hover:text-purple-600 px-4 py-2 rounded-md font-medium">Already have an account? Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="min-h-screen py-12">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Progress Steps -->
            <div class="mb-8">
                <div class="flex justify-between items-center">
                    <div class="flex items-center flex-1">
                        <div id="step1-indicator" class="step-active w-10 h-10 rounded-full flex items-center justify-center font-bold">1</div>
                        <div class="flex-1 h-1 bg-gray-300 mx-2" id="line1"></div>
                    </div>
                    <div class="flex items-center flex-1">
                        <div id="step2-indicator" class="step-inactive w-10 h-10 rounded-full flex items-center justify-center font-bold">2</div>
                        <div class="flex-1 h-1 bg-gray-300 mx-2" id="line2"></div>
                    </div>
                    <div class="flex items-center">
                        <div id="step3-indicator" class="step-inactive w-10 h-10 rounded-full flex items-center justify-center font-bold">3</div>
                    </div>
                </div>
                <div class="flex justify-between mt-2 text-sm">
                    <span class="text-purple-600 font-medium">Account</span>
                    <span class="text-gray-400">Profile</span>
                    <span class="text-gray-400">Goals</span>
                </div>
            </div>

            <!-- Form Container -->
            <div class="bg-white rounded-xl shadow-lg p-8">
                
                <form id="signupForm">
                    
                    <!-- Step 1: Account Info -->
                    <div id="step1" class="step-content">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">Create Your Account</h2>
                        <p class="text-gray-600 mb-6">Let's start with the basics</p>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                                <input type="text" id="username" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    placeholder="Choose a username">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                <input type="email" id="email" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    placeholder="your.email@example.com">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input type="password" id="password" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    placeholder="Create a strong password">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                                <input type="password" id="confirmPassword" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    placeholder="Confirm your password">
                            </div>
                        </div>

                        <button type="button" onclick="nextStep(2)"
                            class="w-full mt-6 bg-purple-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-purple-700 transition">
                            Continue →
                        </button>
                    </div>

                    <!-- Step 2: Profile Info -->
                    <div id="step2" class="step-content hidden">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">Tell Us About Yourself</h2>
                        <p class="text-gray-600 mb-6">This helps us personalize your plan</p>

                        <div class="grid md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Age</label>
                                <input type="number" id="age" required min="15" max="100"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    placeholder="e.g., 25">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Gender</label>
                                <select id="gender" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                    <option value="">Select gender</option>
                                    <option value="M">Male</option>
                                    <option value="F">Female</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Height (cm)</label>
                                <input type="number" id="height" required min="120" max="250"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    placeholder="e.g., 175">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Weight (kg)</label>
                                <input type="number" id="weight" required min="30" max="200" step="0.1"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    placeholder="e.g., 75">
                            </div>
                        </div>

                        <div class="flex gap-4 mt-6">
                            <button type="button" onclick="prevStep(1)"
                                class="flex-1 bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-medium hover:bg-gray-300 transition">
                                ← Back
                            </button>
                            <button type="button" onclick="nextStep(3)"
                                class="flex-1 bg-purple-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-purple-700 transition">
                                Continue →
                            </button>
                        </div>
                    </div>

                    <!-- Step 3: Fitness Goals -->
                    <div id="step3" class="step-content hidden">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">Your Fitness Goals</h2>
                        <p class="text-gray-600 mb-6">What do you want to achieve?</p>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Primary Goal</label>
                                <select id="goal" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                    <option value="">Select your goal</option>
                                    <option value="weight_loss">Weight Loss</option>
                                    <option value="muscle_gain">Muscle Gain</option>
                                    <option value="maintenance">Maintenance</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Activity Level</label>
                                <select id="activity_level" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                    <option value="">Select activity level</option>
                                    <option value="sedentary">Sedentary (little to no exercise)</option>
                                    <option value="light">Lightly Active (1-3 days/week)</option>
                                    <option value="moderate">Moderately Active (3-5 days/week)</option>
                                    <option value="active">Very Active (6-7 days/week)</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Gym Days per Week</label>
                                <input type="number" id="gym_days" required min="0" max="7"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    placeholder="e.g., 3">
                                <p class="text-sm text-gray-500 mt-1">How many days can you work out?</p>
                            </div>
                        </div>

                        <!-- Loading State -->
                        <div id="loadingState" class="hidden text-center py-4">
                            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto mb-4"></div>
                            <p class="text-gray-600">Creating your personalized plan...</p>
                        </div>

                        <!-- Error Message -->
                        <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mt-4">
                            <p id="errorText"></p>
                        </div>

                        <div class="flex gap-4 mt-6">
                            <button type="button" onclick="prevStep(2)"
                                class="flex-1 bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-medium hover:bg-gray-300 transition">
                                ← Back
                            </button>
                            <button type="submit" id="submitBtn"
                                class="flex-1 bg-gradient-to-r from-purple-600 to-purple-700 text-white px-6 py-3 rounded-lg font-medium hover:from-purple-700 hover:to-purple-800 transition shadow-lg">
                                Create Account & Get Plan 
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL =
    window.location.hostname.includes("localhost")
        ? "http://localhost:5000/api"
        : "https://major-project-20zc.onrender.com/api";
        let currentStep = 1;

        function nextStep(step) {
            // Validate current step
            if (currentStep === 1) {
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (!username || !email || !password || !confirmPassword) {
                    alert('Please fill in all fields');
                    return;
                }

                if (password !== confirmPassword) {
                    alert('Passwords do not match');
                    return;
                }

                if (password.length < 6) {
                    alert('Password must be at least 6 characters');
                    return;
                }
            }

            if (currentStep === 2) {
                const age = document.getElementById('age').value;
                const gender = document.getElementById('gender').value;
                const height = document.getElementById('height').value;
                const weight = document.getElementById('weight').value;

                if (!age || !gender || !height || !weight) {
                    alert('Please fill in all fields');
                    return;
                }
            }

            // Hide current step
            document.getElementById(`step${currentStep}`).classList.add('hidden');
            
            // Update indicators
            document.getElementById(`step${currentStep}-indicator`).classList.remove('step-active');
            document.getElementById(`step${currentStep}-indicator`).classList.add('step-completed');
            
            // Show next step
            document.getElementById(`step${step}`).classList.remove('hidden');
            document.getElementById(`step${step}-indicator`).classList.remove('step-inactive');
            document.getElementById(`step${step}-indicator`).classList.add('step-active');
            
            currentStep = step;
        }

        function prevStep(step) {
            // Hide current step
            document.getElementById(`step${currentStep}`).classList.add('hidden');
            document.getElementById(`step${currentStep}-indicator`).classList.remove('step-active');
            document.getElementById(`step${currentStep}-indicator`).classList.add('step-inactive');
            
            // Show previous step
            document.getElementById(`step${step}`).classList.remove('hidden');
            document.getElementById(`step${step}-indicator`).classList.remove('step-completed');
            document.getElementById(`step${step}-indicator`).classList.add('step-active');
            
            currentStep = step;
        }

        // Handle form submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate final step
            const goal = document.getElementById('goal').value;
            const activity_level = document.getElementById('activity_level').value;
            const gym_days = document.getElementById('gym_days').value;

            if (!goal || !activity_level || !gym_days) {
                alert('Please fill in all fields');
                return;
            }

            // Show loading
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('errorMessage').classList.add('hidden');

            // Collect all form data
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                height: parseFloat(document.getElementById('height').value),
                weight: parseFloat(document.getElementById('weight').value),
                goal: goal,
                activity_level: activity_level,
                gym_days: parseInt(gym_days)
            };

            try {
                // Call signup API
                const response = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    // Success! Store user ID and redirect
                    localStorage.setItem('user_id', data.data.user_id);
                    localStorage.setItem('username', data.data.username);
                    localStorage.setItem('token', data.data.token);   // ← ADD THIS
                    
                    // Show success message
                    alert('Account created successfully! Redirecting to dashboard...');
                    
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    // Show error
                    document.getElementById('errorText').textContent = data.message || 'Signup failed. Please try again.';
                    document.getElementById('errorMessage').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Signup error:', error);
                document.getElementById('errorText').textContent = 'Network error. Please make sure the server is running.';
                document.getElementById('errorMessage').classList.remove('hidden');
            } finally {
                // Hide loading
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('loadingState').classList.add('hidden');
            }
        });
    </script>

</body>
</html>
